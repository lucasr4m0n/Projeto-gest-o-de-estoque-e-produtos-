spring.application.name=backend
server.port=${SERVER_PORT:8090}

# Conexão com o PostgreSQL (valores padrão para desenvolvimento local com Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gestao_estoque}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Administrador inicial (desenvolvimento)
app.admin.email=${ADMIN_EMAIL:admin@gestao.com}
app.admin.senha=${ADMIN_SENHA:123456}

# JWT
api.security.token.secret=${JWT_SECRET:chave-secreta-super-segura-para-o-jwt-gestao-estoque-2026}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.default-models-expand-depth=-1