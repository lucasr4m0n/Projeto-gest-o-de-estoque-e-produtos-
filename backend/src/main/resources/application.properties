spring.application.name=backend
server.port=8090

# Conexão com o PostgreSQL no Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/gestao_estoque
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração do Administrador Inicial (Desenvolvimento)
app.admin.email=admin@gestao.com
app.admin.senha=123456